<h1>Número de tareas: {{numberTask}}</h1>
<span>Título tarea: {{titleTask}}</span>

<form class="container_input" #myForm="ngForm" (ngSubmit)="sendData(myForm)">
    <input type="text" placeholder="Ingresar tarea..." 
    [(ngModel)]="titleTask"
    #myInput="ngModel"
    name="taskTitle"
    required
    >
    <button type="submit" [disabled]="!myInput.valid">Ingresar tarea</button>
</form>

{{myInput.valid}}
