<h1>Número de tareas: {{numberTask}}</h1>
<span>Título tarea: {{titleTask}}</span>

<div class="container_input">
    <input type="text" placeholder="Ingresar tarea..." 
    [(ngModel)]="titleTask"
    (input)="sendTask()"
    >
    <button (click)="sendTask()" [disabled]="activeButton">Ingresar tarea</button>
</div>
