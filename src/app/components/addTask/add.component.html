<!--Mensajes de validación de errores-->
<!--form.get('title')?.invalid = si el campo tiene algún error-->
<!--form.get('title')?.dirty || form.get('title')?.touched = ya se cambió el campo (dirty) o entró y salió de él (touched)-->
<!--&& = "y", || = "o"-->
<!--?. evita un error si Angular todavía no encuentra el control llamado title-->
<div *ngIf="form.get('title')?.invalid && (form.get('title')?.dirty || form.get('title')?.touched)">
    <!--Error que indica que la tarea es requerida-->
    <small *ngIf="form.get('title')?.errors?.['required']">
        El título es requerido
    </small>
    <!--Error que indica el límite de caracteres del nombre de la tarea-->
    <small *ngIf="form.get('title')?.errors?.['maxlength']">
        El máximo de caracteres es de 10
    </small>
</div>

<form class="container_input" [formGroup]="form" (ngSubmit)="sendTaskTitle()">
    <input type="text" placeholder="Ingresar tarea"
    //Conecta el campo con el control llamado title
    formControlName="title"
    >
    <!--Desactiva el botón mientras el formulario no sea válido.-->
    <button type="submit" [disabled]="!form.valid">Ingresar tarea</button>
</form>
